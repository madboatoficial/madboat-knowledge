<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Odyssey - SPA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>

        <!-- Texto da primeira cena -->
        <div id="scene1-text" class="scene-text">
            <div class="logo-container">
                <svg class="star-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="currentColor"/>
                    <circle cx="12" cy="12" r="2.5" fill="currentColor" opacity="0.8"/>
                    <path d="M12 4L13.5 10L19.5 12L13.5 14L12 20L10.5 14L4.5 12L10.5 10L12 4Z" fill="currentColor" opacity="0.3"/>
                </svg>
            </div>
            <h1 class="nebula-text">NEBULA</h1>
            <p class="subtitle">Vibecoding Dev Area</p>
        </div>

        <!-- Texto da segunda cena -->
        <div id="scene2-text" class="scene-text">
            <h1 class="odyssey-text">ODISSEIA</h1>
        </div>

        <!-- Indicador de scroll -->
        <div id="scroll-indicator">
            <div class="scroll-arrow">↓</div>
            <p>Role ou arraste</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
